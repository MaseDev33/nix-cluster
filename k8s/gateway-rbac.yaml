apiVersion: v1
kind: ServiceAccount
metadata:
  name: gateway-sync
  namespace: kube-system
automountServiceAccountToken: false
---
apiVersion: v1
kind: Secret
metadata:
  name: gateway-sync-token
  namespace: kube-system
  annotations:
    kubernetes.io/service-account.name: gateway-sync
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: gateway-sync-readonly
rules:
  - apiGroups: [""]
    resources: ["services", "endpoints", "nodes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: gateway-sync-readonly
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: gateway-sync-readonly
subjects:
  - kind: ServiceAccount
    name: gateway-sync
    namespace: kube-system
