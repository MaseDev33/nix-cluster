apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: longhorn-rwx
provisioner: driver.longhorn.io
allowVolumeExpansion: true
reclaimPolicy: Retain
volumeBindingMode: Immediate
parameters:
  numberOfReplicas: "2"
  staleReplicaTimeout: "30"
  fsType: ext4
  migratable: "true"
  recurringJobSelector: '[{"name":"nightly-nas-backup","isGroup":false}]'
---
apiVersion: longhorn.io/v1beta2
kind: Setting
metadata:
  name: backup-target
  namespace: longhorn-system
value: "nfs://10.100.0.12:/mnt/nas/longhorn-backups"
---
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: nightly-nas-backup
  namespace: longhorn-system
spec:
  name: nightly-nas-backup
  cron: "0 2 * * *"
  task: "backup"
  groups:
    - default
  retain: 14
  concurrency: 1
